<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tête de Hoko : aperçu</title>
<!-- Outil de travail : la tête sculptée seule, vue de face, de trois quarts, de profil et de dos. -->
<style>body { margin: 0; background: #20242c; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "../public/vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { sculptHead } from '../public/js/scene/sculpt.js';
import { faceTexture } from '../public/js/scene/head.js';

const W = 1200;
const H = 420;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setScissorTest(true);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb4c8');
scene.add(new THREE.HemisphereLight('#dbe8ff', '#6d5c42', 1.3));
const sun = new THREE.DirectionalLight('#ffe3bd', 2.6);
sun.position.set(-1, 1.4, 1.6);
scene.add(sun);
const rim = new THREE.DirectionalLight('#ffd9a6', 1.4);
rim.position.set(1, 1, -2);
scene.add(rim);

const t0 = performance.now();
const raw = sculptHead();
const ms = Math.round(performance.now() - t0);
const geo = (r, extra = {}) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(r.position, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(r.normal, 3));
    Object.entries(extra).forEach(([k, [a, n]]) => g.setAttribute(k, new THREE.BufferAttribute(a, n)));
    g.setIndex(new THREE.BufferAttribute(r.index, 1));
    return g;
};
const head = new THREE.Mesh(geo(raw.head, { uv: [raw.head.uv, 2] }), new THREE.MeshPhysicalMaterial({ map: faceTexture(), roughness: 0.55, sheen: 0.35, sheenColor: new THREE.Color('#ffb89a') }));
const hair = new THREE.Mesh(geo(raw.hair, { color: [raw.hair.color, 3] }), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6 }));
const band = new THREE.Mesh(geo(raw.band), new THREE.MeshStandardMaterial({ color: '#1c2350', side: THREE.DoubleSide }));
const group = new THREE.Group();
group.add(head, hair, band);
const plate = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.05, 0.012), new THREE.MeshStandardMaterial({ color: '#cfd6dc', metalness: 0.8, roughness: 0.3 }));
plate.position.set(...raw.plate);
group.add(plate);
const params = new URLSearchParams(location.search);
if (params.has('bald')) { hair.visible = false; band.visible = false; plate.visible = false; }
scene.add(group);

const views = [[0, 0.52], [0.7, 0.4], [1.57, 0.4], [3.14, 0.4]];
const camera = new THREE.PerspectiveCamera(22, (W / 4) / H, 0.01, 10);
views.forEach(([a, d], i) => {
    camera.position.set(Math.sin(a) * 0.95, 0.03, Math.cos(a) * 0.95);
    camera.lookAt(0, 0.03, 0);
    renderer.setViewport(i * W / 4, 0, W / 4, H);
    renderer.setScissor(i * W / 4, 0, W / 4, H);
    renderer.render(scene, camera);
});
window.done = { ms, head: raw.head.position.length / 3, hair: raw.hair.position.length / 3 };
</script>
</body>
</html>
