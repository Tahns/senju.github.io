<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio — parcours, compétences et projets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --text: #1c1b19;
      --muted: #6b6861;
      --line: #e4e1d9;
      --accent: #2f5d50;
      --accent-soft: #e3ece8;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131412;
        --surface: #1b1d1a;
        --text: #ecebe6;
        --muted: #a09d95;
        --line: #2c2e2a;
        --accent: #8cc2ae;
        --accent-soft: #1f2d28;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #131412;
      --surface: #1b1d1a;
      --text: #ecebe6;
      --muted: #a09d95;
      --line: #2c2e2a;
      --accent: #8cc2ae;
      --accent-soft: #1f2d28;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

    /* Navigation */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
    nav .brand { font-weight: 700; text-decoration: none; margin-right: auto; }
    nav .links { display: flex; gap: 20px; }
    nav .links a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; }
    nav .links a:hover { color: var(--text); }
    .icon-btn {
      display: inline-grid; place-items: center;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      cursor: pointer;
    }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Hero */
    .hero { padding: 72px 0 56px; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
    .hero img {
      width: 160px; height: 160px; border-radius: 28px; object-fit: cover;
      border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--accent);
      background: var(--accent-soft); padding: 4px 12px; border-radius: 999px;
    }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    h1 {
      font-family: Fraunces, Georgia, serif; font-weight: 600;
      font-size: clamp(36px, 7vw, 56px); line-height: 1.05; letter-spacing: -.02em;
      margin: 16px 0 8px;
    }
    .role { font-size: 20px; font-weight: 500; margin: 0; }
    .loc { color: var(--muted); margin: 4px 0 20px; font-size: 15px; }
    .pitch { color: var(--muted); max-width: 560px; margin: 0 0 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
      text-decoration: none; border: 1px solid var(--line); background: var(--surface);
      transition: transform .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn svg { width: 16px; height: 16px; }

    /* Sections */
    section { padding: 48px 0; border-top: 1px solid var(--line); }
    h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); font-weight: 600; margin: 0 0 24px;
    }
    .about p { font-size: 17px; margin: 0 0 14px; max-width: 680px; }

    .timeline { display: grid; gap: 28px; }
    .item { display: grid; grid-template-columns: 170px 1fr; gap: 24px; }
    .item .when { color: var(--muted); font-size: 14px; padding-top: 2px; }
    .item h3 { margin: 0; font-size: 17px; font-weight: 600; }
    .item .where { color: var(--accent); font-weight: 500; font-size: 15px; }
    .item p { margin: 6px 0 0; color: var(--muted); }

    .skills { display: grid; gap: 18px; }
    .skill-row { display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: start; }
    .skill-row .label { font-weight: 600; font-size: 15px; padding-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line);
    }

    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
    .card .chips .chip { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .card .card-links { display: flex; gap: 16px; font-size: 14px; font-weight: 600; }
    .card .card-links a { text-decoration: none; color: var(--accent); }
    .card .card-links a:hover { text-decoration: underline; }

    .langs { display: flex; flex-wrap: wrap; gap: 8px; }

    .contact { text-align: center; padding: 64px 0; }
    .contact p { color: var(--muted); margin: 0 auto 24px; max-width: 480px; }
    .contact .actions { justify-content: center; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0 40px; }

    @media (max-width: 640px) {
      .wrap { padding: 0 16px; }
      nav .links { display: none; }
      .hero { grid-template-columns: 1fr; padding: 48px 0 40px; gap: 24px; }
      .hero img { width: 96px; height: 96px; border-radius: 20px; order: -1; }
      .item, .skill-row { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <a class="brand" href="#top" id="brand"></a>
      <div class="links">
        <a href="#apropos">À propos</a>
        <a href="#experience">Parcours</a>
        <a href="#competences">Compétences</a>
        <a href="#projets">Projets</a>
        <a href="#contact">Contact</a>
      </div>
      <button class="icon-btn" id="theme" aria-label="Changer de thème"></button>
    </div>
  </nav>

  <main class="wrap" id="top">
    <header class="hero" id="hero"></header>
    <section class="about" id="apropos"></section>
    <section id="experience"></section>
    <section id="formation"></section>
    <section id="competences"></section>
    <section id="projets"></section>
    <section id="langues"></section>
    <section class="contact" id="contact"></section>
  </main>
  <footer id="footer"></footer>

  <script src="data.js"></script>
  <script>
    const d = window.PORTFOLIO;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const $ = id => document.getElementById(id);

    const icons = {
      linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
      github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.83 1.24 1.83 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.42.36.81 1.1.81 2.22v3.29c0 .32.21.7.82.58A12 12 0 0 0 12 .3"/></svg>',
      email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
      cv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    };

    function linkButtons(primary) {
      const l = d.liens || {};
      const out = [];
      if (l.linkedin) out.push(`<a class="btn ${primary ? "primary" : ""}" href="${esc(l.linkedin)}" target="_blank" rel="noopener">${icons.linkedin}LinkedIn</a>`);
      if (l.github) out.push(`<a class="btn" href="${esc(l.github)}" target="_blank" rel="noopener">${icons.github}GitHub</a>`);
      if (l.email) out.push(`<a class="btn" href="mailto:${esc(l.email)}">${icons.email}${primary ? "Email" : esc(l.email)}</a>`);
      if (l.cv) out.push(`<a class="btn" href="${esc(l.cv)}" target="_blank" rel="noopener">${icons.cv}CV</a>`);
      return out.join("");
    }

    function section(id, title, html) {
      const el = $(id);
      if (!html) { el.remove(); return; }
      el.innerHTML = `<h2>${title}</h2>${html}`;
    }

    // En-tête
    document.title = `${d.nom} — Portfolio`;
    $("brand").textContent = d.nom;
    $("hero").innerHTML = `
      <div>
        ${d.disponible ? `<span class="badge">${esc(d.disponible)}</span>` : ""}
        <h1>${esc(d.nom)}</h1>
        <p class="role">${esc(d.titre)}</p>
        ${d.localisation ? `<p class="loc">${esc(d.localisation)}</p>` : ""}
        <p class="pitch">${esc(d.accroche)}</p>
        <div class="actions">${linkButtons(true)}</div>
      </div>
      ${d.photo ? `<img src="${esc(d.photo)}" alt="Photo de ${esc(d.nom)}">` : ""}`;

    section("apropos", "À propos", (d.apropos || []).map(p => `<p>${esc(p)}</p>`).join(""));

    section("experience", "Expérience", (d.experiences || []).length && `<div class="timeline">${d.experiences.map(e => `
      <div class="item">
        <div class="when">${esc(e.periode)}</div>
        <div>
          <h3>${esc(e.poste)}</h3>
          <div class="where">${esc(e.entreprise)}</div>
          ${e.description ? `<p>${esc(e.description)}</p>` : ""}
        </div>
      </div>`).join("")}</div>`);

    section("formation", "Formation", (d.formation || []).length && `<div class="timeline">${d.formation.map(f => `
      <div class="item">
        <div class="when">${esc(f.periode)}</div>
        <div>
          <h3>${esc(f.diplome)}</h3>
          <div class="where">${esc(f.ecole)}</div>
        </div>
      </div>`).join("")}</div>`);

    section("competences", "Compétences", (d.competences || []).length && `<div class="skills">${d.competences.map(g => `
      <div class="skill-row">
        <div class="label">${esc(g.groupe)}</div>
        <div class="chips">${g.items.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</div>
      </div>`).join("")}</div>`);

    section("projets", "Projets", (d.projets || []).length && `<div class="projects">${d.projets.map(p => `
      <article class="card">
        <h3>${esc(p.nom)}</h3>
        <p>${esc(p.description)}</p>
        ${(p.tags || []).length ? `<div class="chips">${p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="card-links">
          ${p.lien ? `<a href="${esc(p.lien)}" target="_blank" rel="noopener">Voir le site →</a>` : ""}
          ${p.code ? `<a href="${esc(p.code)}" target="_blank" rel="noopener">Code source</a>` : ""}
        </div>
      </article>`).join("")}</div>`);

    section("langues", "Langues", (d.langues || []).length && `<div class="langs">${d.langues.map(l => `<span class="chip">${esc(l)}</span>`).join("")}</div>`);

    section("contact", "Contact", `
      <p>Une opportunité, une question ou simplement envie d'échanger ? Le plus simple est de m'écrire sur LinkedIn.</p>
      <div class="actions">${linkButtons(false)}</div>`);

    $("footer").textContent = `© ${new Date().getFullYear()} ${d.nom}`;

    // Thème clair / sombre
    const root = document.documentElement;
    const btn = $("theme");
    const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const paint = () => { btn.innerHTML = isDark() ? icons.sun : icons.moon; };
    try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
    paint();
    btn.addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
      paint();
    });
  </script>
</body>
</html>
